<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title><!-- SDA:TITLE --></title>
<!-- SDA:CSS -->
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="eyebrow">Finance diagnostic</div>
        <h1 id="pageTitle">Finance review</h1>
        <div class="scope" id="scope"></div>
      </div>
      <div class="lens" id="lens"></div>
    </div>
  </header>
  <!-- SDA:BANNER -->
  <nav class="tabs" id="tabs">
    <div class="tabs-in">
      <button data-tab="summary" class="active"><span class="tn">01</span>Summary</button>
      <button data-tab="drivers"><span class="tn">02</span>Drivers</button>
      <button data-tab="outlook"><span class="tn">03</span>Outlook</button>
      <span class="q" id="tabQ"></span>
      <button class="state" id="stateBadge" type="button"></button>
    </div>
  </nav>
  <main>
    <section class="view active" id="view-summary"></section>
    <section class="view" id="view-drivers"></section>
    <section class="view" id="view-outlook"></section>
    <section class="glossary" id="glossary"></section>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<aside class="drawer" id="drawer" aria-label="Detail drawer">
  <div class="dh" id="dh"></div>
  <div class="dbody" id="dbody"></div>
</aside>
<div class="tooltip" id="tip"></div>

<!-- SDA:PAYLOAD -->
<!-- SDA:JS -->
</body>
</html>
