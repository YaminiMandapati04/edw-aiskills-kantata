  - name: BOOKING_LINES
    synonyms:
      - bookings
      - booking lines
      - booked deals
    description: "Booking lines (fact__booking), one row per booking. Salesforce rows: won New Sales and Seat Expansion opportunities of the bookings teams, booked on the close date (BOOKING_METRIC = Recurring Services). NetSuite rows: non-recurring revenue by fiscal month and subsidiary, booked on the period end date (BOOKING_METRIC = Non-Recurring). Source of booking amounts by booking date. Do not mix with opportunity pipeline value."
    base_table:
      database: PROD_DB
      schema: GOLD
      table: FACT_BOOKING
    primary_key:
      columns:
        - BOOKING_KEY
    dimensions:
      - name: BOOKING_DATE
        description: "Booking date: opportunity close date, or accounting period end date for NetSuite lines."
        expr: booking_lines.BOOKING_DATE
        data_type: DATE
        access_modifier: public_access
      - name: BOOKING_METRIC
        description: "Recurring Services (Salesforce won opportunity, New Sales or Seat Expansion) or Non-Recurring (NetSuite non-recurring revenue)."
        expr: booking_lines.BOOKING_METRIC
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BOOKING_SOURCE
        synonyms:
          - source system
        description: Salesforce (recurring ARR) or NetSuite (non-recurring revenue).
        expr: booking_lines.BOOKING_SOURCE
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: Salesforce opportunity ID. NULL on NetSuite lines.
        expr: booking_lines.OPPORTUNITY_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_TYPE
        synonyms:
          - deal type
        description: "Salesforce opportunity type: New Sales or Seat Expansion. NULL on NetSuite lines."
        expr: booking_lines.OPPORTUNITY_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        synonyms:
          - kantata product line
          - sx or ox
        description: Kantata product line (SX or OX). NULL on NetSuite lines.
        expr: booking_lines.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: "Booking amount in USD: blended ARR (BLENDED_ARR_USD) on Salesforce lines, the non-recurring income statement amount on NetSuite lines. Additive across lines of the same BOOKING_METRIC."
        expr: booking_lines.ACV_USD
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: ARR_NEW_ACV_USD
        description: "Booking amount (USD) of lines whose BOOKING_METRIC is ARR (New). fact__booking only produces Recurring Services and Non-Recurring, so this returns 0 until the fact splits recurring bookings into New and Upsell."
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'ARR (New)' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: ARR_UPSELL_ACV_USD
        description: "Booking amount (USD) of lines whose BOOKING_METRIC is ARR (Upsell). fact__booking only produces Recurring Services and Non-Recurring, so this returns 0 until the fact splits recurring bookings into New and Upsell."
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'ARR (Upsell)' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: BOOKED_OPPORTUNITIES
        description: Number of distinct Salesforce opportunities booked. NetSuite lines have no opportunity and are not counted.
        expr: COUNT(DISTINCT booking_lines.OPPORTUNITY_ID)
        access_modifier: public_access
      - name: BOOKING_ACV_USD
        description: Total booking amount (USD) across the selected lines. Mixes recurring (Salesforce) and non-recurring (NetSuite) lines unless filtered by BOOKING_METRIC.
        expr: SUM(booking_lines.ACV_USD)
        access_modifier: public_access
      - name: BOOKING_LINE_COUNT
        description: Number of booking lines (Salesforce opportunities and NetSuite month x subsidiary rows).
        expr: COUNT(booking_lines.BOOKING_KEY)
        access_modifier: public_access
      - name: NON_RECURRING_BOOKINGS_ACV_USD
        description: Non-recurring revenue booking amount (USD) across the selected NetSuite lines.
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'Non-Recurring' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
