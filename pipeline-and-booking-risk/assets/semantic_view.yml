        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_LTM = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_PYMTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Number of open opportunities, window PY_MTD. Returns the value at every as-at date (one value per date, never forced to 0): for the card filter to today (IS_LATEST = TRUE) or pick one date; responds to product, deal source and owner."
        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_MTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_PYQTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Number of open opportunities, window PY_QTD. Returns the value at every as-at date (one value per date, never forced to 0): for the card filter to today (IS_LATEST = TRUE) or pick one date; responds to product, deal source and owner."
        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_QTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_PYYTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Number of open opportunities, window PY_YTD. Returns the value at every as-at date (one value per date, never forced to 0): for the card filter to today (IS_LATEST = TRUE) or pick one date; responds to product, deal source and owner."
        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_YTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
