name: GTM_ANALYTICS
description: "GTM semantic view for Bookings and Pipeline. Bookings: booking lines and KPIs from Salesforce recurring bookings (won New Sales and Seat Expansion opportunities) and NetSuite non-recurring revenue, with calendar MTD / QTD / YTD / LTM windows and prior-year twins. Pipeline: KPIs on the fiscal year (1 Feb to 31 Jan) with prior-year windows, built from the opportunity snapshot (snp_fact__opportunity, one version per change) for past dates and the current opportunity table for today; current opportunities; and stage progression by stage run. One view, several grains: tables are joined only through shared dimensions (calendar, account, owner, subsidiary, stage) and never fact-to-fact. Deals only; leads are not in any table. KPI card metrics read the latest as-at date only."
tables:
  - name: BOOKINGS_OVERVIEW
    synonyms:
      - bookings KPI
      - bookings overview
      - bookings cards
    description: "Bookings KPIs (rpt_gtm__bookings): one row per as-at date (completed month-ends), METRIC_NAME, product, subsidiary, account and owner, with calendar MTD / QTD / YTD / LTM windows and their prior-year twins. Feeds the bookings cards and monthly trend. METRIC_NAME rows are not additive across each other; ARR (New) and ARR (Upsell) are always 0."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_BOOKINGS
    primary_key:
      columns:
        - AS_OF_DATE
        - METRIC_NAME
        - SUBSIDIARY_KEY
        - PRODUCT
        - ACCOUNT_KEY
        - OWNER_KEY
    dimensions:
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). NULL on Non-Recurring rows.
        expr: bookings_overview.ACCOUNT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: AS_OF_DATE
        description: Completed month-end. The current month appears once it has closed.
        expr: bookings_overview.AS_OF_DATE
        data_type: DATE
        access_modifier: public_access
      - name: DATE_KEY
        description: "Date key of the as-at date (dim__date.DATE_KEY, YYYYMMDD). The relationship key to dim_date."
        expr: bookings_overview.DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: IS_LATEST
        description: TRUE only on the last completed month-end (the KPI card date).
        expr: bookings_overview.IS_LATEST
        data_type: BOOLEAN
        access_modifier: public_access
      - name: METRIC_NAME
        description: "Total Bookings, Recurring Bookings, Recurring Services (same as Recurring Bookings), Non-Recurring Bookings, ARR (New) or ARR (Upsell)."
        expr: bookings_overview.METRIC_NAME
        data_type: VARCHAR(22)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). NULL on Non-Recurring rows.
        expr: bookings_overview.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        synonyms:
          - kantata product line
          - sx or ox
        description: Kantata product line (SX or OX). NULL on Non-Recurring rows.
        expr: bookings_overview.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: SUBSIDIARY_NAME
        description: Subsidiary name. NULL on Salesforce (ARR) rows.
        expr: bookings_overview.SUBSIDIARY_NAME
        data_type: VARCHAR(664)
        access_modifier: public_access
    facts:
      - name: LTM
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window LTM: the 12 months ending on AS_OF_DATE. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: MTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window MTD: from the 1st of the month of AS_OF_DATE to AS_OF_DATE. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_LTM
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window PY_LTM: the LTM window with AS_OF_DATE moved back 12 months. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.PY_LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_MTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window PY_MTD: the MTD window with AS_OF_DATE moved back 12 months. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.PY_MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_QTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window PY_QTD: the QTD window with AS_OF_DATE moved back 12 months. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.PY_QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_YTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window PY_YTD: the YTD window with AS_OF_DATE moved back 12 months. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.PY_YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: QTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window QTD: from the 1st of the calendar quarter to AS_OF_DATE. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: YTD
        description: "Booking amount (USD) of the row METRIC_NAME, calendar window YTD: from 1 Jan to AS_OF_DATE. Recurring Bookings = Recurring Services; Total Bookings = Recurring + Non-Recurring. Never add across METRIC_NAME."
        expr: bookings_overview.YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
    metrics:
      - name: ARR_NEW_LTM
        description: "ARR (New) (booking amount, USD), window LTM (the 12 months ending on the as-at date), at each completed month-end. Always 0: the bookings fact does not split recurring bookings into New and Upsell (use OPPORTUNITY_TYPE on booking_lines). Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, account and owner. Never add across METRIC_NAME."
        expr: SUM(CASE WHEN bookings_overview.METRIC_NAME = 'ARR (New)' THEN bookings_overview.LTM ELSE 0 END)
        access_modifier: public_access
      - name: ARR_NEW_MTD
        description: "ARR (New) (booking amount, USD), window MTD (from the 1st of the month of the as-at date to the as-at date), at each completed month-end. Always 0: the bookings fact does not split recurring bookings into New and Upsell (use OPPORTUNITY_TYPE on booking_lines). Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, account and owner. Never add across METRIC_NAME."
        expr: SUM(CASE WHEN bookings_overview.METRIC_NAME = 'ARR (New)' THEN bookings_overview.MTD ELSE 0 END)
        access_modifier: public_access
      - name: ARR_NEW_PYLTM
