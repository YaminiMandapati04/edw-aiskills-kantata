  - name: OPPORTUNITIES
    synonyms:
      - opportunities
      - pipeline
      - opportunity lines
      - deals
    description: "LINE ITEM LEVEL: one row per opportunity line item (OPPORTUNITY_LINE_ITEM_ID), not one row per opportunity, plus one row for a current opportunity with no line items (fact__opportunity). Opportunity attributes repeat on each line; ACV is a line value; counts are distinct opportunity IDs. Current state of open, won and lost opportunities of any close date (not deleted, not on a Test account); no pipeline-stage or amount filter is applied, so use IS_CLOSED, STATUS or IS_ACTIVE_PIPELINE in the metrics. Deals only, leads are not in this table. Current values only; history is in opportunity_stage_history."
    base_table:
      database: PROD_DB
      schema: GOLD
      table: FACT_OPPORTUNITY
    primary_key:
      columns:
        - OPPORTUNITY_LINE_KEY
    dimensions:
      - name: ACCOUNT_ID
        description: Raw Salesforce account ID.
        expr: opportunities.ACCOUNT_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). The relationship key.
        expr: opportunities.ACCOUNT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: ACCOUNT_NAME
        synonyms:
          - account
          - account name
        description: Salesforce account name.
        expr: opportunities.ACCOUNT_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: CLOSE_DATE
        description: "Expected close date while open, actual once closed."
        expr: opportunities.CLOSE_DATE
        data_type: DATE
        access_modifier: public_access
      - name: CREATED_DATE
        description: Opportunity created date.
        expr: opportunities.CREATED_DATE
        data_type: DATE
        access_modifier: public_access
      - name: CREATED_QUARTER
        description: Quarter the opportunity counts as created pipeline (Created Trend axis).
        expr: YEAR(opportunities.PIPELINE_CREATION_DATE) || '-Q' || QUARTER(opportunities.PIPELINE_CREATION_DATE)
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: DATA_REFRESHED_AT
        description: Latest source sync behind the opportunity data (Data Refreshed).
        expr: opportunities.DATA_REFRESHED_AT
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
      - name: EXPECTED_CLOSE_QUARTER
        description: "Expected close quarter label, for example 2026-Q4 (stage chart axis)."
        expr: YEAR(opportunities.CLOSE_DATE) || '-Q' || QUARTER(opportunities.CLOSE_DATE)
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: IS_ACTIVE_PIPELINE
        description: TRUE when the line is in a pipeline stage and ACV_USD > 0.
        expr: opportunities.IS_ACTIVE_PIPELINE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_CLOSED
        description: Salesforce IS_CLOSED.
        expr: opportunities.IS_CLOSED
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_PIPELINE_STAGE
        description: TRUE when the stage is flagged as a pipeline stage in stage_mapping.
        expr: opportunities.IS_PIPELINE_STAGE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        synonyms:
          - opportunity id
          - deal id
        description: Salesforce opportunity ID.
        expr: opportunities.OPPORTUNITY_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_LINE_ITEM_ID
        description: Opportunity line item ID; blank for an opportunity with no line items.
        expr: opportunities.OPPORTUNITY_LINE_ITEM_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_NAME
        synonyms:
          - opportunity
          - deal
        description: Opportunity name.
        expr: opportunities.OPPORTUNITY_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_SOURCE
        synonyms:
          - opportunity source
          - deal source
        description: Opportunity lead source; Unknown when blank.
        expr: opportunities.OPPORTUNITY_SOURCE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_TYPE
        description: Salesforce opportunity type.
        expr: opportunities.OPPORTUNITY_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_ID
        description: Raw Salesforce owner user ID.
        expr: opportunities.OWNER_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key.
        expr: opportunities.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_NAME
        synonyms:
          - sales representative
          - owner
        description: Opportunity owner name.
        expr: opportunities.OWNER_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PIPELINE_CREATION_DATE
        description: Date the opportunity counts as created pipeline; equal to CREATED_DATE.
        expr: opportunities.PIPELINE_CREATION_DATE
        data_type: DATE
        access_modifier: public_access
      - name: PRODUCT
        synonyms:
          - service line
          - product name
        description: Product name of the line (blank for an opportunity with no line items).
        expr: opportunities.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_KEY
        description: Key of the line Salesforce Product2 (dim_product). The relationship key.
        expr: opportunities.PRODUCT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: REGION
        description: "Region (placeholder, always blank for now)."
        expr: opportunities.REGION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_KEY
        description: Key of the current stage (dim_stage_mapping). The relationship key; blank when the stage is not in stage_mapping.
        expr: opportunities.STAGE_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_NAME
        description: Current stage name.
        expr: opportunities.STAGE_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_ORDER
        description: Display order of the stage.
        expr: opportunities.STAGE_ORDER
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: STAGE_TYPE
        description: "Stage category: Open, Won or Lost (blank when the stage is not in stage_mapping)."
        expr: opportunities.STAGE_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STATUS
        description: "Open, Closed Won or Closed Lost (blank when the stage is not in stage_mapping)."
        expr: opportunities.STATUS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: "Line ACV in USD (estimated product ARR change of the line, converted at the Salesforce dated rate on the close date; 0 for an opportunity with no lines). Additive across lines."
        expr: opportunities.ACV_USD
        data_type: FLOAT
        access_modifier: public_access
      - name: PROBABILITY
        description: Opportunity win probability (0-100) as stored in Salesforce. Non-additive.
        expr: opportunities.PROBABILITY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
    metrics:
      - name: AVERAGE_OPPORTUNITY_VALUE
        description: "Average opportunity value (ACV, USD) = open pipeline ACV today / DISTINCT open opportunities, both from this table so a product selection applies to both. Non-additive."
        expr: "SUM(CASE WHEN NOT opportunities.IS_CLOSED AND opportunities.PIPELINE_CREATION_DATE <= CURRENT_DATE() THEN opportunities.ACV_USD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN NOT opportunities.IS_CLOSED AND opportunities.PIPELINE_CREATION_DATE <= CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVERAGE_OPPORTUNITY_VALUE_PRIOR_YEAR
        description: "Average opportunity value (ACV, USD) at today minus 12 months, from the lines current values. Non-additive."
        expr: "SUM(CASE WHEN opportunities.PIPELINE_CREATION_DATE <= ADD_MONTHS(CURRENT_DATE(), -12) AND (NOT opportunities.IS_CLOSED OR opportunities.CLOSE_DATE > ADD_MONTHS(CURRENT_DATE(), -12)) THEN opportunities.ACV_USD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE <= ADD_MONTHS(CURRENT_DATE(), -12) AND (NOT opportunities.IS_CLOSED OR opportunities.CLOSE_DATE > ADD_MONTHS(CURRENT_DATE(), -12)) THEN opportunities.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_LTM
        description: "Opportunities created in the LTM window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATEADD(day, 1, ADD_MONTHS(CURRENT_DATE(), -12)) AND CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_MTD
        description: "Opportunities created in the MTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('month', CURRENT_DATE()) AND CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_PY_LTM
        description: "Opportunities created in the PY_LTM window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATEADD(day, 1, ADD_MONTHS(ADD_MONTHS(CURRENT_DATE(), -12), -12)) AND ADD_MONTHS(CURRENT_DATE(), -12) THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_PY_MTD
        description: "Opportunities created in the PY_MTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('month', ADD_MONTHS(CURRENT_DATE(), -12)) AND ADD_MONTHS(CURRENT_DATE(), -12) THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_PY_QTD
        description: "Opportunities created in the PY_QTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('quarter', ADD_MONTHS(CURRENT_DATE(), -12)) AND ADD_MONTHS(CURRENT_DATE(), -12) THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_PY_YTD
        description: "Opportunities created in the PY_YTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('year', ADD_MONTHS(CURRENT_DATE(), -12)) AND ADD_MONTHS(CURRENT_DATE(), -12) THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_QTD
        description: "Opportunities created in the QTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('quarter', CURRENT_DATE()) AND CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: CREATED_OPPORTUNITIES_YTD
        description: "Opportunities created in the YTD window ending today (or today minus 12 months for PY_): DISTINCT opportunities, one per opportunity whatever the product selection."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE BETWEEN DATE_TRUNC('year', CURRENT_DATE()) AND CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: LOST_ACV_USD
        description: ACV (USD) of Closed Lost opportunity lines. Filter CLOSE_DATE for a period. Additive across lines.
        expr: SUM(CASE WHEN opportunities.STATUS = 'Closed Lost' THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: LOST_OPPORTUNITIES
        description: "Closed Lost opportunities (by the opportunity current stage type): DISTINCT opportunities."
        expr: COUNT(DISTINCT CASE WHEN opportunities.STATUS = 'Closed Lost' THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES
        description: "Open opportunities today: DISTINCT opportunities, so an opportunity with several products counts 1 for any product selection (one product, several, all, or none). Not additive across product rows."
        expr: COUNT(DISTINCT CASE WHEN NOT opportunities.IS_CLOSED AND opportunities.PIPELINE_CREATION_DATE <= CURRENT_DATE() THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_PRIOR_YEAR
        description: "Open opportunities as at today minus 12 months, using the lines current values (created on or before that date and not closed, or closed after it): DISTINCT opportunities. Approximate: it does not use the historical snapshot values the overview uses."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE <= ADD_MONTHS(CURRENT_DATE(), -12) AND (NOT opportunities.IS_CLOSED OR opportunities.CLOSE_DATE > ADD_MONTHS(CURRENT_DATE(), -12)) THEN opportunities.OPPORTUNITY_ID END)"
        access_modifier: public_access
      - name: OPEN_PIPELINE_ACV
        description: "Open pipeline ACV (USD) today: lines of opportunities that are not closed and were created on or before today (same test as the pipeline overview for today). Deals, never leads; test-account, deleted and non-current rows are excluded in the fact. Additive across lines. Group by STAGE_NAME or EXPECTED_CLOSE_QUARTER for the stage chart."
        expr: SUM(CASE WHEN NOT opportunities.IS_CLOSED AND opportunities.PIPELINE_CREATION_DATE <= CURRENT_DATE() THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: OPPORTUNITIES_CREATED
        description: "Opportunities counted as created pipeline (all statuses): DISTINCT opportunities. Use PIPELINE_CREATION_DATE / CREATED_QUARTER for the period and STATUS for the All / Open / Closed Won / Closed Lost toggle."
        expr: COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE IS NOT NULL THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: PIPELINE_CREATED_ACV
        description: "ACV (USD) of lines created as pipeline, by PIPELINE_CREATION_DATE."
        expr: SUM(CASE WHEN opportunities.PIPELINE_CREATION_DATE IS NOT NULL THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: TOTAL_ACV_USD
        description: "ACV (USD) of every line in the fact (open, won and lost). Additive across lines."
        expr: "SUM(COALESCE(opportunities.ACV_USD, 0))"
        access_modifier: public_access
      - name: TOTAL_OPPORTUNITIES
        description: "All opportunities in the fact (any status): DISTINCT opportunities."
        expr: COUNT(DISTINCT CASE WHEN TRUE THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: WEIGHTED_OPEN_PIPELINE_ACV
        description: Open pipeline ACV x probability / 100 (the opportunity Salesforce probability). Additive across lines.
        expr: "SUM(CASE WHEN NOT opportunities.IS_CLOSED AND opportunities.PIPELINE_CREATION_DATE <= CURRENT_DATE() THEN opportunities.ACV_USD * COALESCE(opportunities.PROBABILITY, 0) / 100 ELSE 0 END)"
        access_modifier: public_access
      - name: WIN_RATE
        description: "Win rate = won / (won + lost) opportunities, DISTINCT opportunities, calculated after aggregation (non-additive). Filter CLOSE_DATE for a period."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.STATUS = 'Closed Won' THEN opportunities.OPPORTUNITY_ID END) / NULLIF(COUNT(DISTINCT CASE WHEN opportunities.STATUS IN ('Closed Won', 'Closed Lost') THEN opportunities.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: WON_ACV_USD
        description: "ACV (USD) of Closed Won opportunity lines (opportunity pipeline view, not the bookings metrics). Filter CLOSE_DATE for a period. Additive across lines."
        expr: SUM(CASE WHEN opportunities.STATUS = 'Closed Won' THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: WON_OPPORTUNITIES
        description: "Closed Won opportunities (by the opportunity current stage type): DISTINCT opportunities."
        expr: COUNT(DISTINCT CASE WHEN opportunities.STATUS = 'Closed Won' THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
  - name: OPPORTUNITY_STAGE_HISTORY
    synonyms:
      - stage history
      - stage changes
      - stage transitions
    description: "Stage runs (rpt_gtm__pipeline_stage_history): one row per opportunity x product x continuous period in a stage, with the owner, close date and ACV of the last record of the run (live on the current stage). ACV is the value at the end of the run; use IS_CURRENT_STAGE rows for totals, never sum across stage runs. Runs before the first snapshot version come from Salesforce opportunity history and their ACV and owner are approximate."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_PIPELINE_STAGE_HISTORY
    primary_key:
      columns:
        - OPPORTUNITY_ID
        - PRODUCT_KEY
        - STAGE_RUN_NO
    dimensions:
      - name: CLOSE_DATE
        description: Close date from the last record of the run (live on the current stage).
        expr: opportunity_stage_history.CLOSE_DATE
        data_type: DATE
        access_modifier: public_access
      - name: CREATED_DATE
        description: Opportunity created date.
        expr: opportunity_stage_history.CREATED_DATE
        data_type: DATE
        access_modifier: public_access
      - name: IS_CURRENT_STAGE
        description: TRUE on the last run of each opportunity and product (the Opportunities Summary rows).
        expr: opportunity_stage_history.IS_CURRENT_STAGE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_LEGACY_STAGE
        description: Retired stage.
        expr: opportunity_stage_history.IS_LEGACY_STAGE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: MILESTONE_1_DATE
        description: First start of the milestone-1 stage; blank until the milestone flags are filled in stage_mapping. Repeats on every row of the opportunity.
        expr: opportunity_stage_history.MILESTONE_1_DATE
        data_type: DATE
        access_modifier: public_access
      - name: MILESTONE_2_DATE
        description: First start of the milestone-2 stage; blank until the milestone flags are filled in stage_mapping. Repeats on every row of the opportunity.
        expr: opportunity_stage_history.MILESTONE_2_DATE
        data_type: DATE
        access_modifier: public_access
      - name: MILESTONE_NO
        description: 1 or 2 where the stage is a milestone stage in stage_mapping.
        expr: opportunity_stage_history.MILESTONE_NO
        data_type: "NUMBER(1,0)"
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: Salesforce opportunity ID.
        expr: opportunity_stage_history.OPPORTUNITY_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_NAME
        description: Opportunity name (current).
        expr: opportunity_stage_history.OPPORTUNITY_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_SOURCE
        description: Opportunity source (lead source) from the last record of the run (live on the current stage).
        expr: opportunity_stage_history.OPPORTUNITY_SOURCE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_TYPE
        description: Opportunity type from the last record of the run (live on the current stage).
        expr: opportunity_stage_history.OPPORTUNITY_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_KEY
        description: "Key of the opportunity owner (dim_user), from the last record of the run. The relationship key."
        expr: opportunity_stage_history.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_NAME
        description: Owner name from the last record of the run (live on the current stage). Names can repeat across users; slice on dim_user through OWNER_KEY.
        expr: opportunity_stage_history.OWNER_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        description: Product name of the lines.
        expr: opportunity_stage_history.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_FAMILY
        description: Product family from dim_product.
        expr: opportunity_stage_history.PRODUCT_FAMILY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_KEY
        description: Key of the product (dim_product). The relationship key; part of the grain.
        expr: opportunity_stage_history.PRODUCT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: REGION
        description: "Region from the last record of the run (placeholder, always NULL for now)."
        expr: opportunity_stage_history.REGION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_END_DATE
        description: Start date of the next run (Stage End Date); blank for the current stage.
        expr: opportunity_stage_history.STAGE_END_DATE
        data_type: DATE
        access_modifier: public_access
      - name: STAGE_KEY
        description: Key of the stage of this run (dim_stage_mapping). The relationship key; blank when the stage is not in stage_mapping.
        expr: opportunity_stage_history.STAGE_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_NAME
        description: Stage of the run.
        expr: opportunity_stage_history.STAGE_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_RUN_NO
        description: "1, 2, 3 ... per opportunity and product; a new run starts when the stage differs from the previous reading."
        expr: opportunity_stage_history.STAGE_RUN_NO
        data_type: "NUMBER(13,0)"
        access_modifier: public_access
      - name: STAGE_START_DATE
        description: Date of the first reading of the run (Stage Start Date).
        expr: opportunity_stage_history.STAGE_START_DATE
        data_type: DATE
        access_modifier: public_access
      - name: STAGE_START_DATE_KEY
        description: Date key of STAGE_START_DATE (YYYYMMDD). The relationship key to dim_date.
        expr: opportunity_stage_history.STAGE_START_DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: STATUS
        description: "Status of the run, derived from the stage (Open, Closed Won, Closed Lost)."
        expr: opportunity_stage_history.STATUS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: Product ACV in USD from the last record of the run (live on the current stage). Non-additive across stage runs; sum only IS_CURRENT_STAGE rows for totals.
        expr: opportunity_stage_history.ACV_USD
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: CURRENT_ACV_USD
        description: "Current opportunity ACV (USD): the value on each opportunity x product current-stage row, so it is not repeated across stage runs."
        expr: SUM(CASE WHEN opportunity_stage_history.IS_CURRENT_STAGE THEN opportunity_stage_history.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: OPPORTUNITIES_IN_HISTORY
        description: Distinct opportunities (non-additive across groups).
        expr: COUNT(DISTINCT opportunity_stage_history.OPPORTUNITY_ID)
        access_modifier: public_access
      - name: STAGE_CHANGES
        description: Number of stage runs (one per opportunity x product x continuous period in a stage).
        expr: COUNT(DISTINCT opportunity_stage_history.OPPORTUNITY_ID || '|' || opportunity_stage_history.PRODUCT_KEY || '|' || opportunity_stage_history.STAGE_RUN_NO)
        access_modifier: public_access
  - name: PIPELINE_OVERVIEW
    synonyms:
      - pipeline KPI
      - pipeline overview
      - pipeline cards
    description: "Pipeline KPIs by as-at date (completed month-ends plus today), metric, product, opportunity source, account, owner, close date and stage, with MTD / QTD / YTD / LTM and prior-year windows (rpt_gtm__pipeline_overview). Rows are not additive across METRIC_NAME. There is no pipeline target data yet."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_PIPELINE_OVERVIEW
    primary_key:
      columns:
        - AS_OF_DATE
        - METRIC_NAME
        - OPPORTUNITY_ID
        - PRODUCT
        - OPPORTUNITY_SOURCE
        - REGION
        - OWNER_ID
        - PRODUCT_KEY
        - ACCOUNT_KEY
        - CLOSE_DATE
        - STAGE_NAME
    dimensions:
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). The relationship key.
        expr: pipeline_overview.ACCOUNT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: AS_OF_DATE
        description: Completed month-end or today.
        expr: pipeline_overview.AS_OF_DATE
        data_type: DATE
        access_modifier: public_access
      - name: AS_OF_QUARTER
        description: Quarter label of the as-at date (Pipeline Value Trend axis).
        expr: YEAR(pipeline_overview.AS_OF_DATE) || '-Q' || QUARTER(pipeline_overview.AS_OF_DATE)
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: CLOSE_DATE
        description: Expected close date of the row (as at the row date for open pipeline).
        expr: pipeline_overview.CLOSE_DATE
        data_type: DATE
        access_modifier: public_access
      - name: DATE_KEY
        description: "Date key of the as-at date (dim__date.DATE_KEY, YYYYMMDD). The relationship key to dim_date."
        expr: pipeline_overview.DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: EXPECTED_CLOSE_QUARTER
        description: "Expected close quarter label of the row (for example 2026-Q4), from its close date as of the same row."
        expr: YEAR(pipeline_overview.CLOSE_DATE) || '-Q' || QUARTER(pipeline_overview.CLOSE_DATE)
        data_type: VARCHAR(134217728)
        access_modifier: public_access
      - name: IS_LATEST
        description: TRUE only on today rows; the cards read these.
        expr: pipeline_overview.IS_LATEST
        data_type: BOOLEAN
        access_modifier: public_access
      - name: METRIC_NAME
        description: "Open Pipeline Value, Weighted Pipeline Value, Open Opportunities, Opportunities Created or Pipeline Created Value."
        expr: pipeline_overview.METRIC_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: Opportunity ID on the Open Opportunities / Opportunities Created count rows (blank on every other row). The count metrics count distinct IDs.
        expr: pipeline_overview.OPPORTUNITY_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_SOURCE
        synonyms:
          - deal source
        description: Opportunity Source filter.
        expr: pipeline_overview.OPPORTUNITY_SOURCE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_ID
        description: Owner ID.
        expr: pipeline_overview.OWNER_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key.
        expr: pipeline_overview.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_NAME
        description: Opportunity Owner filter.
        expr: pipeline_overview.OWNER_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        description: Service Line / Product filter.
        expr: pipeline_overview.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_FAMILY
        description: "Salesforce Product2 family of the line product, from dim_product."
        expr: pipeline_overview.PRODUCT_FAMILY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_KEY
        description: Product key of the line Salesforce Product2 (relates to dim_product).
        expr: pipeline_overview.PRODUCT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: REGION
        description: "Region (placeholder, always blank for now)."
        expr: pipeline_overview.REGION
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_KEY
        description: "Key of the stage (dim_stage_mapping): the stage at the as-at date for open metrics, the current stage for created metrics. The relationship key; blank when the stage is not in stage_mapping."
        expr: pipeline_overview.STAGE_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STAGE_NAME
        description: "Stage name of the row (stage at the as-at date for open metrics, current stage for created metrics), for open pipeline by stage. Plain text, not a key."
        expr: pipeline_overview.STAGE_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: LTM
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: MTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_LTM
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.PY_LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_MTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.PY_MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_QTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.PY_QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_YTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.PY_YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: QTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: YTD
        description: Window value of the row METRIC_NAME. Open metrics hold the same as-at level in every current window and the prior-year level in PY_*; created metrics are windowed. Never add across METRIC_NAME.
        expr: pipeline_overview.YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
    metrics:
      - name: AVG_OPPORTUNITY_VALUE_ACV_LTM
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.LTM ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.LTM = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_MTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.MTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.MTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYLTM
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_LTM ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_LTM = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYMTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_MTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_MTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYQTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_QTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_QTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYYTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_YTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.PY_YTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_QTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.QTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.QTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_YTD
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Average Opportunity Value (ACV) = open pipeline ACV / open opportunities, calculated after aggregation (non-additive)."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.YTD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.YTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_ASAT
        description: TREND. Open Opportunities (COUNT) as it stood at each as-at date; use one date per bar (month-end dates plus today). Responds to the Trend Period and business filters.
        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.YTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_LTM
        description: "Distinct opportunities: an opportunity counts 1 whatever the product, owner or stage selection (not additive across groups). KPI CARD. Number of open opportunities, window LTM. Returns the value at every as-at date (one value per date, never forced to 0): for the card filter to today (IS_LATEST = TRUE) or pick one date; responds to product, deal source and owner."
        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.LTM = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
