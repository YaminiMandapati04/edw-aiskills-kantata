      - name: STAGE_NAME
        synonyms:
          - stage
          - sales stage
        description: "Current stage name, from 00 - PROSPECT to 07 - CLOSE (WON) / 07 - CLOSE (LOST)."
        expr: opportunities.STAGE_NAME
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: STAGE_ORDER
        description: "Stage order from stage_mapping (1 for 00 - PROSPECT to 9 for 07 - CLOSE (LOST)), for sorting."
        expr: opportunities.STAGE_ORDER
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: STAGE_PROBABILITY
        synonyms:
          - win probability
          - stage probability
        description: "Default win probability (0-1) of the stage, from stage_mapping. Blank until the seed is maintained."
        expr: opportunities.STAGE_PROBABILITY
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: STAGE_TYPE
        description: "Open, Won or Lost."
        expr: opportunities.STAGE_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: STATUS
        description: "Open, Closed Won or Closed Lost."
        expr: opportunities.STATUS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: "Opportunity ACV in USD (Salesforce BLENDED_ARR_USD) as it is today, not restated for past dates. Additive across opportunities."
        expr: opportunities.ACV_USD
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
    metrics:
      - name: AVERAGE_OPPORTUNITY_VALUE
        description: "Average opportunity value (ACV, USD) = open pipeline ACV today / open opportunities, both from this table. Non-additive."
        expr: "SUM(CASE WHEN opportunities.IS_ACTIVE_PIPELINE THEN opportunities.ACV_USD ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN opportunities.IS_ACTIVE_PIPELINE THEN opportunities.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: LOST_ACV_USD
        description: ACV (USD) of closed-lost opportunities.
        expr: SUM(CASE WHEN opportunities.STAGE_TYPE = 'Lost' THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: LOST_OPPORTUNITIES
        description: Closed-lost opportunities.
        expr: COUNT(DISTINCT CASE WHEN opportunities.STAGE_TYPE = 'Lost' THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES
        description: "Number of opportunities in a pipeline stage (01 - ENGAGE to 06 - NEGOTIATE) with ACV_USD > 0, today."
        expr: COUNT(DISTINCT CASE WHEN opportunities.IS_ACTIVE_PIPELINE THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_PIPELINE_ACV
        description: "ACV (USD, blended ARR) of the opportunities in a pipeline stage with ACV_USD > 0, today."
        expr: SUM(CASE WHEN opportunities.IS_ACTIVE_PIPELINE THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: OPPORTUNITIES_CREATED
        description: Opportunities that count as created pipeline (stage 3 reached; PIPELINE_CREATION_DATE populated). Group by PIPELINE_CREATION_DATE for the period.
        expr: COUNT(DISTINCT CASE WHEN opportunities.PIPELINE_CREATION_DATE IS NOT NULL THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: PIPELINE_CREATED_ACV
        description: "ACV (USD) of opportunities that count as created pipeline, at their current value."
        expr: SUM(CASE WHEN opportunities.PIPELINE_CREATION_DATE IS NOT NULL THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: TOTAL_ACV_USD
        description: "ACV (USD) of all opportunities in the pipeline scope (open, won and lost)."
        expr: SUM(opportunities.ACV_USD)
        access_modifier: public_access
      - name: TOTAL_OPPORTUNITIES
        description: "Number of opportunities (open, won and lost) in the pipeline scope."
        expr: COUNT(DISTINCT opportunities.OPPORTUNITY_ID)
        access_modifier: public_access
      - name: WIN_RATE
        description: "Won opportunities / (won + lost), a ratio of the same table. Not a stored average."
        expr: "COUNT(DISTINCT CASE WHEN opportunities.STAGE_TYPE = 'Won' THEN opportunities.OPPORTUNITY_ID END) / NULLIF(COUNT(DISTINCT CASE WHEN opportunities.STAGE_TYPE IN ('Won', 'Lost') THEN opportunities.OPPORTUNITY_ID END), 0)"
        access_modifier: public_access
      - name: WON_ACV_USD
        description: Blended ARR (USD) of closed-won opportunities.
        expr: SUM(CASE WHEN opportunities.STAGE_TYPE = 'Won' THEN opportunities.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: WON_OPPORTUNITIES
        description: Closed-won opportunities (New Sales and Seat Expansion in the pipeline scope).
        expr: COUNT(DISTINCT CASE WHEN opportunities.STAGE_TYPE = 'Won' THEN opportunities.OPPORTUNITY_ID END)
        access_modifier: public_access
  - name: OPPORTUNITY_STAGE_HISTORY
    synonyms:
      - stage history
      - stage progression
      - stage changes
    description: "Stage progression (rpt_gtm__pipeline_stage_history): one row per opportunity per stage run (a continuous period in one stage; a new run starts when the stage name changes). Product, source, type, region, owner, close date and ACV_USD are the values at the end of the run (live values for the current stage). ACV_USD is not additive across stage runs."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_PIPELINE_STAGE_HISTORY
    primary_key:
      columns:
        - OPPORTUNITY_KEY
        - STAGE_RUN_NO
    dimensions:
      - name: CLOSE_DATE
        description: Expected close date at the end of the run.
        expr: opportunity_stage_history.CLOSE_DATE
        data_type: DATE
        access_modifier: public_access
      - name: CREATED_DATE
        description: "Opportunity created date (UTC), repeated on every stage run."
        expr: opportunity_stage_history.CREATED_DATE
        data_type: DATE
        access_modifier: public_access
      - name: IS_CURRENT_STAGE
        description: TRUE for the current stage run of the opportunity.
        expr: opportunity_stage_history.IS_CURRENT_STAGE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: IS_LEGACY_STAGE
        description: TRUE when the stage is flagged legacy in stage_mapping (or is missing from it).
        expr: opportunity_stage_history.IS_LEGACY_STAGE
        data_type: BOOLEAN
        access_modifier: public_access
      - name: MILESTONE_1_DATE
        description: First start date of the MILESTONE_1 stage (04 - PROPOSE) for the opportunity; repeated on every row of the opportunity.
        expr: opportunity_stage_history.MILESTONE_1_DATE
        data_type: DATE
        access_modifier: public_access
      - name: MILESTONE_2_DATE
        description: First start date of the MILESTONE_2 stage (06 - NEGOTIATE) for the opportunity; repeated on every row of the opportunity.
        expr: opportunity_stage_history.MILESTONE_2_DATE
        data_type: DATE
        access_modifier: public_access
      - name: MILESTONE_NO
        description: "1 for the MILESTONE_1 stage (04 - PROPOSE), 2 for the MILESTONE_2 stage (06 - NEGOTIATE), blank otherwise."
        expr: opportunity_stage_history.MILESTONE_NO
        data_type: "NUMBER(1,0)"
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: Salesforce opportunity ID.
        expr: opportunity_stage_history.OPPORTUNITY_ID
        data_type: VARCHAR(18)
        access_modifier: public_access
      - name: OPPORTUNITY_KEY
        description: Surrogate key of the opportunity (fact__opportunity.OPPORTUNITY_KEY). With STAGE_RUN_NO it identifies the row.
        expr: opportunity_stage_history.OPPORTUNITY_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: OPPORTUNITY_NAME
        description: "Opportunity name today, repeated on every stage run."
        expr: opportunity_stage_history.OPPORTUNITY_NAME
        data_type: VARCHAR(360)
        access_modifier: public_access
      - name: OPPORTUNITY_SOURCE
        synonyms:
          - deal source
        description: "Marketing (Inbound, Outbound), Sales (SelfGen, Partners) or the raw lead generation value at the end of the run."
        expr: opportunity_stage_history.OPPORTUNITY_SOURCE
        data_type: VARCHAR(3900)
        access_modifier: public_access
      - name: OPPORTUNITY_TYPE
        synonyms:
          - deal type
        description: New Sales or Seat Expansion at the end of the run.
        expr: opportunity_stage_history.OPPORTUNITY_TYPE
        data_type: VARCHAR(3900)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key.
        expr: opportunity_stage_history.OWNER_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: OWNER_NAME
        description: Name of the opportunity owner at the end of the run.
        expr: opportunity_stage_history.OWNER_NAME
        data_type: VARCHAR(361)
        access_modifier: public_access
      - name: PRODUCT
        description: "Product line (SX, OX, Undecided) or Unassigned at the end of the run."
        expr: opportunity_stage_history.PRODUCT
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: PRODUCT_FAMILY
        description: Same value as PRODUCT (the product line).
        expr: opportunity_stage_history.PRODUCT_FAMILY
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: REGION
        description: Owner global region (NorAm or EMEA) at the end of the run.
        expr: opportunity_stage_history.REGION
        data_type: VARCHAR(3900)
        access_modifier: public_access
      - name: STAGE_END_DATE
        description: Start date of the next stage run; blank for the current stage.
        expr: opportunity_stage_history.STAGE_END_DATE
        data_type: DATE
        access_modifier: public_access
      - name: STAGE_KEY
        description: Key of the stage of this run (dim_stage_mapping). The relationship key; blank when the stage is not in stage_mapping.
        expr: opportunity_stage_history.STAGE_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: STAGE_NAME
        description: "Stage of this run, as recorded. Older stage names are shown as they are."
        expr: opportunity_stage_history.STAGE_NAME
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: STAGE_RUN_NO
        description: "Sequence of stage runs for the opportunity, from 1."
        expr: opportunity_stage_history.STAGE_RUN_NO
        data_type: "NUMBER(13,0)"
        access_modifier: public_access
      - name: STAGE_START_DATE
        description: Date the opportunity entered this stage run (UTC).
        expr: opportunity_stage_history.STAGE_START_DATE
        data_type: DATE
        access_modifier: public_access
      - name: STAGE_START_DATE_KEY
        description: Date key of STAGE_START_DATE (YYYYMMDD). The relationship key to dim_date.
        expr: opportunity_stage_history.STAGE_START_DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: STATUS
        description: "Open, Closed Won or Closed Lost for the stage of this run (from stage_mapping)."
        expr: opportunity_stage_history.STATUS
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: ACV (USD) of the opportunity at the end of this stage run (the live value for the current stage). Not additive across stage runs.
        expr: opportunity_stage_history.ACV_USD
        data_type: "NUMBER(38,2)"
        access_modifier: public_access
    metrics:
      - name: OPPORTUNITIES_IN_HISTORY
        description: "Distinct opportunities with a stage run in the selection, for example in a given stage or starting in a given period."
        expr: COUNT(DISTINCT opportunity_stage_history.OPPORTUNITY_ID)
        access_modifier: public_access
      - name: STAGE_CHANGES
        description: "Number of stage runs (continuous periods in one stage), including the first stage the opportunity was in."
        expr: COUNT(opportunity_stage_history.OPPORTUNITY_ID)
        access_modifier: public_access
  - name: PIPELINE_OVERVIEW
    synonyms:
      - pipeline KPI
      - pipeline overview
      - pipeline cards
    description: "Pipeline KPIs (rpt_gtm__pipeline_overview): one row per as-at date (completed month-ends plus today), METRIC_NAME, opportunity, product, opportunity source, region, account, owner, close date and stage, with MTD / QTD / YTD / LTM windows and their prior-year twins on the fiscal year. Related to dim_date, dim_account, dim_user and dim_stage_mapping. Rows are not additive across METRIC_NAME."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_PIPELINE_OVERVIEW
    primary_key:
      columns:
        - AS_OF_DATE
        - METRIC_NAME
        - OPPORTUNITY_ID
        - PRODUCT
        - OPPORTUNITY_SOURCE
        - REGION
        - ACCOUNT_KEY
        - OWNER_ID
        - CLOSE_DATE
        - STAGE_NAME
    dimensions:
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). The relationship key.
        expr: pipeline_overview.ACCOUNT_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: AS_OF_DATE
        description: "As-at date of the row: a completed month-end, or today. The values are the pipeline as it stood on that date."
        expr: pipeline_overview.AS_OF_DATE
        data_type: DATE
        access_modifier: public_access
      - name: CLOSE_DATE
        description: Expected close date of the opportunity as of the row. Part of the grain.
        expr: pipeline_overview.CLOSE_DATE
        data_type: DATE
        access_modifier: public_access
      - name: DATE_KEY
        description: Date key of the as-at date (YYYYMMDD). The relationship key to dim_date.
        expr: pipeline_overview.DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: IS_LATEST
        description: TRUE only on the rows of today (the latest as-at date); FALSE on the completed month-end rows. Filter on it for the KPI cards.
        expr: pipeline_overview.IS_LATEST
        data_type: BOOLEAN
        access_modifier: public_access
      - name: METRIC_NAME
        description: "Open Pipeline Value, Open Opportunities, Weighted Pipeline Value (blank until stage probabilities are entered), Opportunities Created or Pipeline Created Value."
        expr: pipeline_overview.METRIC_NAME
        data_type: VARCHAR(23)
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: "Salesforce opportunity ID. Part of the grain: each row is one opportunity."
        expr: pipeline_overview.OPPORTUNITY_ID
        data_type: VARCHAR(18)
        access_modifier: public_access
      - name: OPPORTUNITY_SOURCE
        synonyms:
          - deal source
        description: "Marketing (Inbound, Outbound), Sales (SelfGen, Partners) or the raw lead generation value, as of the as-at date."
        expr: pipeline_overview.OPPORTUNITY_SOURCE
        data_type: VARCHAR(3900)
        access_modifier: public_access
      - name: OWNER_ID
        description: Raw Salesforce owner user ID.
        expr: pipeline_overview.OWNER_ID
        data_type: VARCHAR(18)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key.
        expr: pipeline_overview.OWNER_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: OWNER_NAME
        description: "Name of the opportunity owner, as of the as-at date."
        expr: pipeline_overview.OWNER_NAME
        data_type: VARCHAR(361)
        access_modifier: public_access
      - name: PRODUCT
        synonyms:
          - kantata product line
          - sx or ox
        description: "Product line (SX, OX, Undecided) or Unassigned, as of the as-at date."
        expr: pipeline_overview.PRODUCT
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: PRODUCT_FAMILY
        synonyms:
          - product family
        description: Same value as PRODUCT (the product line).
        expr: pipeline_overview.PRODUCT_FAMILY
        data_type: VARCHAR(765)
        access_modifier: public_access
      - name: REGION
        description: "Global region of the opportunity owner (for example NorAm or EMEA), as of the as-at date."
        expr: pipeline_overview.REGION
        data_type: VARCHAR(3900)
        access_modifier: public_access
      - name: STAGE_KEY
        description: "Key of the stage (dim_stage_mapping): the stage at the as-at date for open metrics, the current stage for created metrics. The relationship key; blank when the stage is not in stage_mapping."
        expr: pipeline_overview.STAGE_KEY
        data_type: VARCHAR(32)
        access_modifier: public_access
      - name: STAGE_NAME
        description: "Stage name at the as-at date (open metrics) or the current stage (created metrics). Part of the grain: rows are split by stage."
        expr: pipeline_overview.STAGE_NAME
        data_type: VARCHAR(765)
        access_modifier: public_access
    facts:
      - name: LTM
        description: "Value of the row METRIC_NAME for window LTM (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in the 12 months ending on AS_OF_DATE. Never add across METRIC_NAME."
        expr: pipeline_overview.LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: MTD
        description: "Value of the row METRIC_NAME for window MTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in from the 1st of the month of AS_OF_DATE to AS_OF_DATE. Never add across METRIC_NAME."
        expr: pipeline_overview.MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_LTM
        description: "Value of the row METRIC_NAME for window PY_LTM (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in the LTM window with AS_OF_DATE moved back 12 months. Never add across METRIC_NAME."
        expr: pipeline_overview.PY_LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_MTD
        description: "Value of the row METRIC_NAME for window PY_MTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in the MTD window with AS_OF_DATE moved back 12 months. Never add across METRIC_NAME."
        expr: pipeline_overview.PY_MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_QTD
        description: "Value of the row METRIC_NAME for window PY_QTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in the QTD window with AS_OF_DATE moved back 12 months. Never add across METRIC_NAME."
        expr: pipeline_overview.PY_QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_YTD
        description: "Value of the row METRIC_NAME for window PY_YTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in the YTD window with AS_OF_DATE moved back 12 months. Never add across METRIC_NAME."
        expr: pipeline_overview.PY_YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: QTD
        description: "Value of the row METRIC_NAME for window QTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in from the start of the fiscal quarter (1 Feb, 1 May, 1 Aug or 1 Nov) to AS_OF_DATE. Never add across METRIC_NAME."
        expr: pipeline_overview.QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: YTD
        description: "Value of the row METRIC_NAME for window YTD (fiscal year). Open metrics (Open Pipeline Value, Open Opportunities, Weighted Pipeline Value) hold the same as-at level in every current window and the level 12 months earlier in PY_*; created metrics (Opportunities Created, Pipeline Created Value) count opportunities with PIPELINE_CREATION_DATE in from the start of the fiscal year (1 Feb) to AS_OF_DATE. Never add across METRIC_NAME."
        expr: pipeline_overview.YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
    metrics:
      - name: AVG_OPPORTUNITY_VALUE_ACV_LTM
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window LTM = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.LTM ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.LTM ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_MTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window MTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.MTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.MTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYLTM
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window PY_LTM = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_LTM ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.PY_LTM ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYMTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window PY_MTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_MTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.PY_MTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYQTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window PY_QTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_QTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.PY_QTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_PYYTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window PY_YTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.PY_YTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.PY_YTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_QTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window QTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.QTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.QTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: AVG_OPPORTUNITY_VALUE_ACV_YTD
        description: "KPI CARD. Average Opportunity Value (ACV, USD), window YTD = Open Pipeline Value / Open Opportunities, calculated after aggregation (not additive; blank when there are no open opportunities). Filter to today (IS_LATEST = TRUE) or one as-at date."
        expr: "SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Pipeline Value' THEN pipeline_overview.YTD ELSE 0 END) / NULLIF(SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' THEN pipeline_overview.YTD ELSE 0 END), 0)"
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_ASAT
        description: "TREND. Open Opportunities (count) as it stood at each as-at date (same level in every window column, so YTD is read); use one date per bar. Responds to business filters."
