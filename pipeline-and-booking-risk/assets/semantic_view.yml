        expr: SUM(CASE WHEN bookings_overview.METRIC_NAME = 'ARR (New)' THEN bookings_overview.PY_MTD ELSE 0 END)
        access_modifier: public_access
      - name: ARR_NEW_PYQTD
        description: "ARR (New) (booking amount, USD), window PY_QTD (the QTD window with the as-at date moved back 12 months), at each completed month-end. Always 0: the bookings fact does not split recurring bookings into New and Upsell (use OPPORTUNITY_TYPE on booking_lines). Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, account and owner. Never add across METRIC_NAME."
