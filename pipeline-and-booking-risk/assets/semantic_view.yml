name: GTM_ANALYTICS
description: "GTM semantic view for Bookings, Pipeline Overview and Opportunities Details: booking rows and KPIs (Salesforce ARR bookings plus Non-Recurring bookings from the GL), current-state opportunity lines, stage runs with the values of the last record of each run, and pipeline KPIs (prior-year windows). One view, several grains, joined only through shared dimensions. Deals only: leads are not in any table. There are no pipeline targets, so no target attainment or coverage ratio. KPI card metrics read the latest as-at date only."
tables:
  - name: BOOKINGS_OVERVIEW
    synonyms:
      - bookings KPI
      - bookings overview
      - bookings cards
    description: "Bookings by completed month-end as-at date, booking metric, subsidiary, product, owner and account, with MTD / QTD / YTD / LTM and prior-year windows (rpt_gtm__bookings). Feeds the bookings cards and monthly trend. METRIC_NAME rows are not additive across each other."
    base_table:
      database: PROD_DB
      schema: REPORTING
      table: RPT_GTM_BOOKINGS
    primary_key:
      columns:
        - AS_OF_DATE
        - METRIC_NAME
        - SUBSIDIARY_KEY
        - PRODUCT_KEY
        - OWNER_KEY
        - ACCOUNT_KEY
    dimensions:
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). The relationship key; blank on Non-Recurring rows.
        expr: bookings_overview.ACCOUNT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: AS_OF_DATE
        description: Completed month-end. The current month appears once it has closed.
        expr: bookings_overview.AS_OF_DATE
        data_type: DATE
        access_modifier: public_access
      - name: DATE_KEY
        description: "Date key of the as-at date (dim__date.DATE_KEY, YYYYMMDD, for example 20260131). The relationship key to dim_date."
        expr: bookings_overview.DATE_KEY
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
      - name: IS_LATEST
        description: TRUE only on the last completed month-end (the KPI card date).
        expr: bookings_overview.IS_LATEST
        data_type: BOOLEAN
        access_modifier: public_access
      - name: METRIC_NAME
        description: "Total Bookings, Recurring Bookings, Non-Recurring Bookings, ARR (New) or ARR (Upsell)."
        expr: bookings_overview.METRIC_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key; blank on Non-Recurring rows.
        expr: bookings_overview.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        description: Booking product name (One Time Services on Non-Recurring rows).
        expr: bookings_overview.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_KEY
        description: Key of the product (dim_product). The relationship key.
        expr: bookings_overview.PRODUCT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: SUBSIDIARY_NAME
        description: Subsidiary name; blank on the Salesforce ARR rows (no Salesforce subsidiary).
        expr: bookings_overview.SUBSIDIARY_NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: LTM
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: MTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_LTM
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.PY_LTM
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_MTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.PY_MTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_QTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.PY_QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: PY_YTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.PY_YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: QTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.QTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
      - name: YTD
        description: "Window value of the row METRIC_NAME (booking ACV in USD). Total Bookings = Recurring + Non-Recurring, Recurring = ARR (New) + ARR (Upsell): never add across METRIC_NAME."
        expr: bookings_overview.YTD
        data_type: "NUMBER(38,6)"
        access_modifier: public_access
    metrics:
      - name: ARR_NEW_LTM
        description: "ARR (New) (booking ACV, USD), window LTM, at each completed month-end. Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, owner and account."
        expr: SUM(CASE WHEN bookings_overview.METRIC_NAME = 'ARR (New)' THEN bookings_overview.LTM ELSE 0 END)
        access_modifier: public_access
      - name: ARR_NEW_MTD
        description: "ARR (New) (booking ACV, USD), window MTD, at each completed month-end. Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, owner and account."
        expr: SUM(CASE WHEN bookings_overview.METRIC_NAME = 'ARR (New)' THEN bookings_overview.MTD ELSE 0 END)
        access_modifier: public_access
      - name: ARR_NEW_PYLTM
        description: "ARR (New) (booking ACV, USD), window PY_LTM, at each completed month-end. Group by AS_OF_DATE for the trend; the KPI cards read the most recent date. Responds to subsidiary, product, owner and account."
