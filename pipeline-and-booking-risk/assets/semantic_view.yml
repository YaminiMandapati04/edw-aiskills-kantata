module_custom_instructions:
  sql_generation: |-
    A. SOURCE SELECTION
        1. Use the predefined metric for a business term; never rebuild it from raw filters.
        2. Never combine bookings and pipeline in one query unless the view defines a relationship between them. Use one query per side.
        3. Do not combine pre-computed KPI metrics and detail-level metrics in one query unless a predefined metric does so. Use two subqueries joined on shared dimensions.
        4. Where a table holds one row set per metric name, rows are not additive across metric names. Filter to the metric asked for, or use the predefined metric.
        B. DATES AND WINDOWS
        1. For pre-computed KPI snapshots, filter to exactly one as-at date by equality. Never use ranges, and never sum month-to-date, quarter-to-date, year-to-date or last-twelve-month columns across dates.
        2. Choose the window column that matches the question. For monthly series, return one monthly value per as-at month, and use the prior-year column for the same month last year.
        3. For detail-level bookings queries, cap the date at the latest as-at date of the bookings KPI object.
        4. Point-in-time metrics (open pipeline, weighted pipeline, open opportunities) are the same in every window. Created values are flows over the window.
        5. Resolve relative dates from CURRENT_DATE() using the view's calendar. If no fiscal calendar is defined, use calendar periods and say so. "Last quarter" is the last completed quarter; "this quarter" is the current quarter to date.
        6. Use the date that matches the event: booking date for bookings, close date for won, lost and expected close, created date for created opportunities.
        C. METRIC INTEGRITY
        1. Do not apply ABS() or negation to metrics. Sign handling is built in; present values as returned. Where reversals exist, gross is the sum of positive lines and reversals the sum of negative lines.
        2. Recurring and non-recurring bookings, and new and upsell categories, come from the predefined metrics. Do not redefine them. Booking categories are bookings, not ARR balances.
        3. Never add monthly movements to get a quarter, year or twelve-month value. Read the window column at one as-at date.
        4. Count deals with the predefined count metrics (distinct IDs). Never count rows, and never sum values across history or stage-run rows: use current-state rows.
        5. Use the predefined win-rate metric. If asked for win rate by value, compute won value / (won value + lost value) from the predefined metrics and say so.
        6. There are no pipeline targets: do not compute target attainment or coverage ratio.
        7. Never average pre-computed ratios or percentages. Recompute from the summed numerator and denominator.
        D. FILTERS AND JOINS
        1. Join only through defined relationships. If a dimension is not related to the chosen metric's table, say so instead of forcing a join.
        2. Use ILIKE '%value%' for name filters.
        3. Never hardcode product, entity, owner or account names. Read them from the dimension values.
        E. CALCULATIONS AND OUTPUT
        1. Variance % = DIV0NULL(actual - comparison, ABS(comparison)). Return actual, comparison and both variances.
        2. Include the as-at date or period and the grouping dimension as output columns.
        3. Order trends chronologically, never by period name text.
        4. Top-N default is 10.
        5. Drill-down: use the same metric and filters as the parent question, group by deal, order by value descending, LIMIT 100.
        6. Show percentages as 0.0% and currency in the view's reporting currency.
        7. If the requested metric, comparison or dimension is not available on the chosen source, say so and return the closest supported result.
    F. Trend data visualisation
    1. If the user asks for a single month, quarter or year (single row output), show the start and end date.
    2. If the user asks for data at a monthly level, show only the month and the values, with no sorting or duplicate date fields. Do the same for quarter and year.
    3. If the user asks for year-to-date data, show the YTD value for the current year and not a monthly series.
  question_categorization: |-
    Classify each GTM question into the categories below BEFORE choosing tables or metrics. A question can match more than one category (for example 1 + 2); apply the routing of each. Use only the tables, metrics and dimensions defined in the semantic view.

    CATEGORIES
    1. Headline KPIs for a standard period (a month, quarter to date, year to date, last twelve months) for bookings or pipeline: use the view's pre-computed KPI or overview objects where they exist.
    2. Prior-year comparison and growth: use the prior-year columns or metrics the view provides. If none exist for the requested metric, say so.
    3. Breakdown, ranking or top-N by a dimension (product, entity, account, owner, stage, source): use the object that offers that dimension. If the dimension is not available for the metric, say so.
    4. Drill-down, custom date range, or lists of individual deals or booking rows: use detail-level (line or opportunity) objects.
    5. Trend or time series: use one value per month or quarter from the KPI objects where available.
    6. Stage movement, time in stage, win and loss, or sales cycle: use the opportunity and stage objects.
    7. Bookings compared with pipeline: never join them. Run one query per side and compare totals, months or products only, and say the bases differ.
    8. Definitions or lists of dimension values: dimension tables only, no metrics.

    ASK FOR CLARIFICATION WHEN
    1. No time period is given. Assume the latest available period of the matching KPI object (the latest completed month for bookings, the latest as-at date for pipeline) and state the assumption.
    2. A metric has competing definitions (win rate by count or by value, recurring versus total bookings). Pick the best match, say which was used, and mention the alternative.
    3. A named account, owner or product matches several records.

    OUT OF SCOPE (DO NOT GENERATE SQL)
    - Forecasts, projections and "what if" questions.
    - A bookings plan or budget, pipeline targets, target attainment and coverage ratio: the view defines none.
    - ARR balance, retention, churn, renewals due and customer counts, unless the view defines them.
    - Price, discount, cost, CAC, invoices, revenue and headcount.
    - Leads, unless the view contains them.
    - Linking individual deals to bookings, unless the view defines that relationship.
    - Any data change.
    For these, say briefly what is not supported and suggest the nearest in-scope question.
verified_queries:
  - name: PRODUCTS_SUBSIDIARIES_GROWING_OR_SHRINKING
    sql: "\n      -- Find the latest month-end that bookings are reported for.\n      WITH latest AS (\n        SELECT\n          MAX(as_of_date) AS max_date\n        FROM\n          bookings_overview\n      ),\n      -- For each product and subsidiary, take Total Bookings year to date and for the same period last year.\n      bookings_summary AS (\n        SELECT\n          bo.product,\n          bo.subsidiary_name,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS total_bookings_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS total_bookings_py_ytd\n        FROM\n          bookings_overview AS bo\n          CROSS JOIN latest\n        WHERE\n          bo.as_of_date = latest.max_date\n        GROUP BY\n          bo.product,\n          bo.subsidiary_name\n      )\n      -- Work out the change and percentage change and label each as Growing, Shrinking or Flat; the percentage is blank where last year had no bookings.\n      SELECT\n        bs.product,\n        bs.subsidiary_name,\n        bs.total_bookings_ytd,\n        bs.total_bookings_py_ytd,\n        bs.total_bookings_ytd - bs.total_bookings_py_ytd AS ytd_abs_chg,\n        (bs.total_bookings_ytd - bs.total_bookings_py_ytd) / NULLIF(NULLIF(bs.total_bookings_py_ytd, 0), 0) AS ytd_pct_chg,\n        CASE\n          WHEN bs.total_bookings_ytd > bs.total_bookings_py_ytd THEN 'Growing'\n          WHEN bs.total_bookings_ytd < bs.total_bookings_py_ytd THEN 'Shrinking'\n          ELSE 'Flat'\n        END AS trend\n      FROM\n        bookings_summary AS bs\n      ORDER BY\n        ytd_abs_chg DESC NULLS LAST\n      "
    question: Which products and subsidiaries are growing or shrinking?
  - name: RECURRING_VS_NON_RECURRING_BOOKINGS_YTD
    sql: "\n      -- Take year to date and last year to date for Recurring, Non-Recurring and Total Bookings at the latest month-end.\n      WITH base AS (\n        SELECT\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Recurring Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS recurring_bookings_ytd_2026,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Non-Recurring Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS non_recurring_bookings_ytd_2026,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS total_bookings_ytd_2026,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Recurring Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS recurring_bookings_ytd_2025,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Non-Recurring Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS non_recurring_bookings_ytd_2025,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS total_bookings_ytd_2025\n        FROM\n          bookings_overview AS bo\n        WHERE\n          bo.is_latest = TRUE\n      )\n      -- Calculate the recurring share of total for each year, the change in share (0.05 = 5 percentage points) and the change in recurring dollars.\n      SELECT\n        recurring_bookings_ytd_2026,\n        non_recurring_bookings_ytd_2026,\n        total_bookings_ytd_2026,\n        recurring_bookings_ytd_2025,\n        non_recurring_bookings_ytd_2025,\n        total_bookings_ytd_2025,\n        recurring_bookings_ytd_2026 / NULLIF(NULLIF(total_bookings_ytd_2026, 0), 0) AS recurring_pct_ytd_2026,\n        recurring_bookings_ytd_2025 / NULLIF(NULLIF(total_bookings_ytd_2025, 0), 0) AS recurring_pct_ytd_2025,\n        (\n          recurring_bookings_ytd_2026 / NULLIF(NULLIF(total_bookings_ytd_2026, 0), 0)\n        ) - (\n          recurring_bookings_ytd_2025 / NULLIF(NULLIF(total_bookings_ytd_2025, 0), 0)\n        ) AS recurring_pct_diff_pp,\n        recurring_bookings_ytd_2026 - recurring_bookings_ytd_2025 AS recurring_bookings_dollar_diff\n      FROM\n        base\n      "
    question: "How much of our bookings is recurring (vs non-recurring) year-to-date in 2026, and how does that compare to year-to-date in 2025?"
  - name: BOOKINGS_VS_LAST_YEAR_BY_TYPE
    sql: "\n      -- Take year to date and last year to date for each booking type at the latest month-end.\n      WITH base AS (\n        SELECT\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS total_bookings_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Total Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS total_bookings_py_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Recurring Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS recurring_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Recurring Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS recurring_py_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Non-Recurring Bookings' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS non_recurring_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'Non-Recurring Bookings' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS non_recurring_py_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'ARR (New)' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS arr_new_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'ARR (New)' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS arr_new_py_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'ARR (Upsell)' THEN bo.ytd\n              ELSE 0\n            END\n          ) AS arr_upsell_ytd,\n          SUM(\n            CASE\n              WHEN bo.metric_name = 'ARR (Upsell)' THEN bo.py_ytd\n              ELSE 0\n            END\n          ) AS arr_upsell_py_ytd\n        FROM\n          bookings_overview AS bo\n        WHERE\n          bo.is_latest = TRUE\n      ),\n      -- One row per booking type with the change and percentage change; Total Bookings is shown but left out of the largest-mover highlight. Recurring already includes ARR New and ARR Upsell, so those groups overlap.\n      breakdown AS (\n        SELECT\n          'Total Bookings' AS booking_type,\n          1 AS sort_order,\n          total_bookings_ytd AS current_ytd,\n          total_bookings_py_ytd AS prior_year_ytd,\n          total_bookings_ytd - total_bookings_py_ytd AS absolute_change,\n          (total_bookings_ytd - total_bookings_py_ytd) / NULLIF(NULLIF(total_bookings_py_ytd, 0), 0) AS pct_change,\n          FALSE AS eligible_for_driver\n        FROM\n          base\n        UNION ALL\n        SELECT\n          'Recurring Bookings' AS booking_type,\n          2 AS sort_order,\n          recurring_ytd AS current_ytd,\n          recurring_py_ytd AS prior_year_ytd,\n          recurring_ytd - recurring_py_ytd AS absolute_change,\n          (recurring_ytd - recurring_py_ytd) / NULLIF(NULLIF(recurring_py_ytd, 0), 0) AS pct_change,\n          TRUE AS eligible_for_driver\n        FROM\n          base\n        UNION ALL\n        SELECT\n          'Non-Recurring Bookings' AS booking_type,\n          3 AS sort_order,\n          non_recurring_ytd AS current_ytd,\n          non_recurring_py_ytd AS prior_year_ytd,\n          non_recurring_ytd - non_recurring_py_ytd AS absolute_change,\n          (non_recurring_ytd - non_recurring_py_ytd) / NULLIF(NULLIF(non_recurring_py_ytd, 0), 0) AS pct_change,\n          TRUE AS eligible_for_driver\n        FROM\n          base\n        UNION ALL\n        SELECT\n          'ARR (New)' AS booking_type,\n          4 AS sort_order,\n          arr_new_ytd AS current_ytd,\n          arr_new_py_ytd AS prior_year_ytd,\n          arr_new_ytd - arr_new_py_ytd AS absolute_change,\n          (arr_new_ytd - arr_new_py_ytd) / NULLIF(NULLIF(arr_new_py_ytd, 0), 0) AS pct_change,\n          TRUE AS eligible_for_driver\n        FROM\n          base\n        UNION ALL\n        SELECT\n          'ARR (Upsell)' AS booking_type,\n          5 AS sort_order,\n          arr_upsell_ytd AS current_ytd,\n          arr_upsell_py_ytd AS prior_year_ytd,\n          arr_upsell_ytd - arr_upsell_py_ytd AS absolute_change,\n          (arr_upsell_ytd - arr_upsell_py_ytd) / NULLIF(NULLIF(arr_upsell_py_ytd, 0), 0) AS pct_change,\n          TRUE AS eligible_for_driver\n        FROM\n          base\n      )\n      -- Flag the booking type with the largest change in dollars (a tie flags more than one).\n      SELECT\n        booking_type,\n        current_ytd,\n        prior_year_ytd,\n        absolute_change,\n        pct_change,\n        CASE\n          WHEN eligible_for_driver\n          AND ABS(absolute_change) = MAX(\n            CASE\n              WHEN eligible_for_driver THEN ABS(absolute_change)\n              ELSE NULL\n            END\n          ) OVER () THEN TRUE\n          ELSE FALSE\n        END AS is_largest_driver\n      FROM\n        breakdown\n      ORDER BY\n        sort_order\n      "
    question: "How are bookings tracking against last year, and what's driving it?"
  - name: PIPELINE_TREND_BY_QUARTER
    sql: "\n      -- Get open and weighted pipeline for each reporting date in the last 365 days.\n      WITH pipeline_dates AS (\n        SELECT\n          *\n        FROM\n          SEMANTIC_VIEW(\n            PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS open_pipeline_acv_asat,\n            weighted_pipeline_acv_asat DIMENSIONS pipeline_overview.as_of_date,\n            as_of_quarter\n            WHERE\n              pipeline_overview.as_of_date >= DATEADD(DAY, -365, CURRENT_DATE)\n          )\n      ),\n      -- Choose one date per quarter: the last date for finished quarters, the latest date for the current quarter. Check that the result shows one row per quarter.\n      quarter_end_dates AS (\n        SELECT\n          as_of_quarter,\n          CASE\n            WHEN as_of_quarter < YEAR(CURRENT_DATE) || '-Q' || QUARTER(CURRENT_DATE) THEN LAST_VALUE(as_of_date) OVER (\n              PARTITION BY as_of_quarter\n              ORDER BY\n                as_of_date\n            )\n            ELSE MAX(as_of_date) OVER (PARTITION BY as_of_quarter)\n          END AS selected_date\n        FROM\n          pipeline_dates\n      ),\n      -- List each quarter once with its chosen date.\n      unique_quarter_dates AS (\n        SELECT\n          DISTINCT as_of_quarter,\n          selected_date\n        FROM\n          quarter_end_dates\n      )\n      -- Keep only the chosen date for each quarter, newest quarter first.\n      SELECT\n        p.as_of_quarter,\n        uqd.selected_date AS as_of_date,\n        p.open_pipeline_acv_asat,\n        p.weighted_pipeline_acv_asat\n      FROM\n        pipeline_dates AS p\n        JOIN unique_quarter_dates AS uqd ON p.as_of_quarter = uqd.as_of_quarter\n        AND p.as_of_date = uqd.selected_date\n      ORDER BY\n        p.as_of_quarter DESC NULLS LAST\n      "
    question: 'What is the weighted and unweighted pipeline trend by Quarter in the last 1 year? '
  - name: TOP_5_OPEN_OPPORTUNITIES
    sql: "\n      SELECT\n        o.opportunity_name,\n        o.opportunity_id,\n        SUM(\n          CASE\n            WHEN NOT o.is_closed\n            AND o.pipeline_creation_date <= CURRENT_DATE THEN o.acv_usd\n            ELSE 0\n          END\n        ) AS open_pipeline_acv,\n        MAX(o.stage_name) AS current_stage,\n        MAX(o.close_date) AS expected_close_date\n      FROM\n        opportunities AS o\n      -- Only open opportunities created on or before today; stage and close date repeat on every line of an opportunity, so MAX returns the single value.\n      WHERE\n        NOT o.is_closed\n        AND o.pipeline_creation_date <= CURRENT_DATE\n      GROUP BY\n        o.opportunity_name,\n        o.opportunity_id\n      ORDER BY\n        open_pipeline_acv DESC NULLS LAST\n      LIMIT\n        5\n      "
    question: What are the top 5 open opportunities by value? Show their value along with current stage and Expected close date
  - name: OPEN_OPPORTUNITIES_TODAY
    sql: "\n      SELECT\n        *\n      FROM\n        SEMANTIC_VIEW(\n          PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS open_opportunities_mtd\n          WHERE\n            pipeline_overview.is_latest = TRUE\n        )\n      "
    question: What is the number of open opportunities as of today?
  - name: OPPORTUNITIES_CREATED_VS_PRIOR_YEAR
    sql: "\n      -- Get the created counts for this year and last year for each period as at today.\n      WITH current_periods AS (\n        SELECT\n          *\n        FROM\n          SEMANTIC_VIEW(\n            PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS opportunities_created_mtd,\n            opportunities_created_qtd,\n            opportunities_created_ytd,\n            opportunities_created_pymtd,\n            opportunities_created_pyqtd,\n            opportunities_created_pyytd\n            WHERE\n              pipeline_overview.is_latest = TRUE\n          )\n      ),\n      -- One row per period (MTD, QTD, YTD) with the change and percentage change; the percentage is blank where last year was zero.\n      results AS (\n        SELECT\n          'MTD' AS window_period,\n          opportunities_created_mtd AS current_value,\n          opportunities_created_pymtd AS prior_year_value,\n          opportunities_created_mtd - opportunities_created_pymtd AS absolute_change,\n          CASE\n            WHEN opportunities_created_pymtd <> 0 THEN (\n              opportunities_created_mtd - opportunities_created_pymtd\n            ) / NULLIF(opportunities_created_pymtd, 0)\n            ELSE NULL\n          END AS pct_change\n        FROM\n          current_periods\n        UNION ALL\n        SELECT\n          'QTD' AS window_period,\n          opportunities_created_qtd AS current_value,\n          opportunities_created_pyqtd AS prior_year_value,\n          opportunities_created_qtd - opportunities_created_pyqtd AS absolute_change,\n          CASE\n            WHEN opportunities_created_pyqtd <> 0 THEN (\n              opportunities_created_qtd - opportunities_created_pyqtd\n            ) / NULLIF(opportunities_created_pyqtd, 0)\n            ELSE NULL\n          END AS pct_change\n        FROM\n          current_periods\n        UNION ALL\n        SELECT\n          'YTD' AS window_period,\n          opportunities_created_ytd AS current_value,\n          opportunities_created_pyytd AS prior_year_value,\n          opportunities_created_ytd - opportunities_created_pyytd AS absolute_change,\n          CASE\n            WHEN opportunities_created_pyytd <> 0 THEN (\n              opportunities_created_ytd - opportunities_created_pyytd\n            ) / NULLIF(opportunities_created_pyytd, 0)\n            ELSE NULL\n          END AS pct_change\n        FROM\n          current_periods\n      )\n      -- Show the percentage with one decimal and order the rows MTD, QTD, YTD.\n      SELECT\n        window_period,\n        current_value,\n        prior_year_value,\n        absolute_change,\n        TO_CHAR(ROUND(pct_change * 100, 1)) || '%' AS pct_change_formatted\n      FROM\n        results\n      ORDER BY\n        CASE\n          window_period\n          WHEN 'MTD' THEN 1\n          WHEN 'QTD' THEN 2\n          WHEN 'YTD' THEN 3\n        END\n      "
    question: "What is the number of opportunities created MTD, QTD, YTD? Compare with previous year and show the growth? "
  - name: RECURRING_NON_RECURRING_TOTAL_BOOKINGS_WINDOWS
    sql: "\n      SELECT\n        bo.metric_name,\n        SUM(\n          CASE\n            WHEN bo.metric_name IN (\n              'Recurring Bookings',\n              'Non-Recurring Bookings',\n              'Total Bookings'\n            ) THEN bo.ltm\n            ELSE 0\n          END\n        ) AS ltm_value,\n        SUM(\n          CASE\n            WHEN bo.metric_name IN (\n              'Recurring Bookings',\n              'Non-Recurring Bookings',\n              'Total Bookings'\n            ) THEN bo.mtd\n            ELSE 0\n          END\n        ) AS mtd_value,\n        SUM(\n          CASE\n            WHEN bo.metric_name IN (\n              'Recurring Bookings',\n              'Non-Recurring Bookings',\n              'Total Bookings'\n            ) THEN bo.qtd\n            ELSE 0\n          END\n        ) AS qtd_value,\n        SUM(\n          CASE\n            WHEN bo.metric_name IN (\n              'Recurring Bookings',\n              'Non-Recurring Bookings',\n              'Total Bookings'\n            ) THEN bo.ytd\n            ELSE 0\n          END\n        ) AS ytd_value\n      FROM\n        bookings_overview AS bo\n      WHERE\n        bo.is_latest = TRUE\n        AND bo.metric_name IN (\n          'Recurring Bookings',\n          'Non-Recurring Bookings',\n          'Total Bookings'\n        )\n      GROUP BY\n        bo.metric_name\n      ORDER BY\n        CASE\n          bo.metric_name\n          WHEN 'Total Bookings' THEN 1\n          WHEN 'Recurring Bookings' THEN 2\n          WHEN 'Non-Recurring Bookings' THEN 3\n        END\n      "
    question: "What are the LTM, MTD, QTD and YTD values for recurring, non-recurring and total bookings?"
  - name: OPEN_PIPELINE_AND_DATED_TO_CLOSE
    sql: "\n      -- First part: open and weighted pipeline as at today. Second part: value of opportunity lines by close date.\n      SELECT\n        sv1.open_pipeline_acv,\n        sv1.weighted_open_pipeline_acv,\n        sv2.dated_to_close\n      FROM\n        (\n          SELECT\n            *\n          FROM\n            SEMANTIC_VIEW(\n              PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS open_pipeline_value_ytd AS open_pipeline_acv,\n              weighted_pipeline_value_ytd AS weighted_open_pipeline_acv\n              WHERE\n                pipeline_overview.is_latest = TRUE\n            )\n        ) AS sv1\n      -- Dated to close adds up every status (open, won and lost) with a close date from 1 Oct to 31 Dec 2026; update these dates each quarter.\n        CROSS JOIN (\n          SELECT\n            *\n          FROM\n            SEMANTIC_VIEW(\n              PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS total_acv_usd AS dated_to_close\n              WHERE\n                opportunities.close_date >= '2026-10-01'\n                AND opportunities.close_date <= '2026-12-31'\n            )\n        ) AS sv2\n      "
    question: "What does open pipeline look like, and how much will realistically close this quarter?"
  - name: AVG_OPPORTUNITY_VALUE_MTD
    sql: "\n      SELECT\n        *\n      FROM\n        SEMANTIC_VIEW(\n          PROD_DB.SEMANTIC_VIEWS.gtm_analytics METRICS avg_opportunity_value_acv_mtd\n          WHERE\n            pipeline_overview.is_latest = TRUE\n        )\n      "
    question: What is the MTD average opportunity value?
