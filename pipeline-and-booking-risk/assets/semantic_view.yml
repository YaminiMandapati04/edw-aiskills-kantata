        expr: COUNT(DISTINCT CASE WHEN pipeline_overview.METRIC_NAME = 'Open Opportunities' AND pipeline_overview.MTD = 1 THEN pipeline_overview.OPPORTUNITY_ID END)
        access_modifier: public_access
      - name: OPEN_OPPORTUNITIES_PYLTM
