        access_modifier: public_access
      - name: QUARTER_YEAR
        description: Calendar quarter and year as Qn-YYYY.
        expr: dim_date.QUARTER_YEAR
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: YEAR
        synonyms:
