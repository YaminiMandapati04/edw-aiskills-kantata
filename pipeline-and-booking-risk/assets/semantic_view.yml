  - name: BOOKING_LINES
    synonyms:
      - bookings
      - booking lines
      - closed won lines
    description: "Booking lines (fact__booking): one row per opportunity line item of a Salesforce closed-won opportunity (BOOKING_SOURCE = Salesforce), plus monthly Non-Recurring rows from the GL (BOOKING_SOURCE = NetSuite; one-time services, no opportunity, account or owner). Authoritative source for booking ACV by booking date. Do not mix with opportunity pipeline value."
    base_table:
      database: PROD_DB
      schema: GOLD
      table: FACT_BOOKING
    primary_key:
      columns:
        - BOOKING_KEY
    dimensions:
      - name: ACCOUNT_KEY
        description: Key of the account (dim_account). The relationship key; blank on Non-Recurring rows.
        expr: booking_lines.ACCOUNT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BOOKING_DATE
        description: "Booking date: the opportunity close date (Salesforce) or the accounting period end date (Non-Recurring); the date a booking counts in."
        expr: booking_lines.BOOKING_DATE
        data_type: DATE
        access_modifier: public_access
      - name: BOOKING_KEY
        description: "Booking row key (hashed from the opportunity line item ID, or from the income statement row for Non-Recurring rows)."
        expr: booking_lines.BOOKING_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BOOKING_METRIC
        description: "ARR (New), ARR (Upsell) or Non-Recurring."
        expr: booking_lines.BOOKING_METRIC
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: BOOKING_SOURCE
        description: "Where the booking row comes from: Salesforce for ARR bookings, NetSuite for Non-Recurring bookings."
        expr: booking_lines.BOOKING_SOURCE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_ID
        description: Salesforce opportunity ID; blank on Non-Recurring rows.
        expr: booking_lines.OPPORTUNITY_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_LINE_ITEM_ID
        description: Salesforce opportunity line item ID; blank on Non-Recurring rows.
        expr: booking_lines.OPPORTUNITY_LINE_ITEM_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OPPORTUNITY_TYPE
        description: "Opportunity type: New Customer, Upgrade, Renewal or Downgrade (blank on Non-Recurring rows)."
        expr: booking_lines.OPPORTUNITY_TYPE
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: OWNER_KEY
        description: Key of the opportunity owner (dim_user). The relationship key; blank on Non-Recurring rows.
        expr: booking_lines.OWNER_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT
        description: Booking product name (One Time Services on Non-Recurring rows).
        expr: booking_lines.PRODUCT
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: PRODUCT_KEY
        description: Key of the product (dim_product). The relationship key.
        expr: booking_lines.PRODUCT_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
      - name: SUBSIDIARY_KEY
        description: Key of the subsidiary (dim_subsidiary). Only on Non-Recurring rows; blank on Salesforce rows.
        expr: booking_lines.SUBSIDIARY_KEY
        data_type: VARCHAR(16777216)
        access_modifier: public_access
    facts:
      - name: ACV_USD
        description: "Booking amount in USD (Salesforce: year-1 product change to ARR of the line, signed; NetSuite Non-Recurring: monthly one-time services amount from the GL)."
        expr: booking_lines.ACV_USD
        data_type: FLOAT
        access_modifier: public_access
    metrics:
      - name: ARR_NEW_ACV_USD
        description: Booking ACV (USD) of Salesforce lines whose transaction category is New.
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'ARR (New)' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: ARR_UPSELL_ACV_USD
        description: Booking ACV (USD) of all other Salesforce lines (any transaction category other than New).
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'ARR (Upsell)' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: BOOKING_ACV_USD
        description: Booking ACV in USD of rows that count in a booking metric. Additive across rows; use BOOKING_DATE for the period.
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC IS NOT NULL THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
      - name: BOOKING_LINE_COUNT
        description: Number of booking rows (opportunity line items of closed-won opportunities plus monthly Non-Recurring GL rows).
        expr: COUNT(booking_lines.BOOKING_KEY)
        access_modifier: public_access
      - name: NON_RECURRING_BOOKINGS_ACV_USD
        description: Booking amount (USD) of the Non-Recurring rows (one-time services from the GL).
        expr: SUM(CASE WHEN booking_lines.BOOKING_METRIC = 'Non-Recurring' THEN booking_lines.ACV_USD ELSE 0 END)
        access_modifier: public_access
