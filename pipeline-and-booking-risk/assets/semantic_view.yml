      - name: WEIGHTED_PIPELINE_VALUE_YTD
        description: "KPI CARD. Weighted Pipeline Value, window YTD. Open pipeline ACV_USD (USD) x the stage win probability (stage_mapping PROBABILITY, 0 to 1) . Blank until probabilities are entered in the stage_mapping seed. Open metrics hold the same as-at level in every current window and the level 12 months earlier in PY_* windows. Returns the value at every as-at date (one value per date): for the card filter to today (IS_LATEST = TRUE) or pick one date; responds to product, opportunity source, region, account, owner and stage. Never add across METRIC_NAME."
        expr: SUM(CASE WHEN pipeline_overview.METRIC_NAME = 'Weighted Pipeline Value' THEN pipeline_overview.YTD ELSE 0 END)
        access_modifier: public_access
